services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_DEFAULT_TIMEOUT: ${PIP_DEFAULT_TIMEOUT:-120}
        PIP_RETRIES: ${PIP_RETRIES:-5}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env.example
    environment:
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
      INTERACTIVE_ENTRY_ENABLED: ${INTERACTIVE_ENTRY_ENABLED:-false}
      COACH_CONVERSATIONS_ENABLED: ${COACH_CONVERSATIONS_ENABLED:-false}
      COACH_AGENT_MODE: ${COACH_AGENT_MODE:-legacy}
      ENTRY_TASK_TTL_DAYS: ${ENTRY_TASK_TTL_DAYS:-30}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      - ./backend/data:/app/backend/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_API_V1_BASE_URL: ${VITE_API_V1_BASE_URL:-http://localhost:8000/api/v1}
        VITE_COACH_CONVERSATIONS_ENABLED: ${VITE_COACH_CONVERSATIONS_ENABLED:-false}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
